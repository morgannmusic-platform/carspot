    document.addEventListener('DOMContentLoaded', function () {
      let color = localStorage.getItem('cs-theme-color') || '#007aff';
      if (window.applyThemeColor) window.applyThemeColor(color);
    });
  </script>
  <!-- Script theme-color retiré, tout passe par applyThemeColor -->

<body>
  <main id="app-content">
    <h2>Réglages</h2>
    <div class="glass-form">
      <label>Couleur ou dégradé de fond :</label><br>
      <input type="color" id="color1" value="#007aff"> à
      <input type="color" id="color2" value=""><br>
      <small>(Laisse la 2e couleur vide pour une seule couleur)</small><br><br>
      <label>Animation du dégradé : <input type="checkbox" id="animate-gradient"></label><br><br>
      <button onclick="applyGradient()">Appliquer</button>
      <button onclick="resetBg()">Défaut</button>
      <hr>
      <label>Image de fond :</label>
      <input type="file" id="bg-file" accept="image/*"><br>
      <button onclick="uploadBgImage()">Uploader et appliquer</button>
      <button onclick="removeBgImage()" style="background:#ff4444;color:#fff;margin-left:8px;">Supprimer
        l'image</button>

      <hr>
      <label>Couleur de la barre du navigateur (Safari MacOS) :</label>
      <input type="color" id="theme-color-picker" style="vertical-align:middle;" />
      <button id="apply-theme-color" style="margin-left:8px;">Appliquer</button>
      <button id="reset-theme-color" style="margin-left:8px;">Réinitialiser</button>
      <br><br>

      <hr>
      <label>Couleur du texte :</label>
      <input type="color" id="text-color" value="#1c1c1e"><br><br>
      <label>Couleur des titres :</label>
      <input type="color" id="title-color" value="#1c1c1e"><br><br>
      <label>Couleur des boutons :</label>
      <input type="color" id="btn-color" value="#007aff"><br><br>
      <label>Couleur du texte des boutons :</label>
      <input type="color" id="btn-text-color" value="#fff"><br><br>
      <button onclick="applyColors()">Appliquer les couleurs</button>
    </div>
  </main>

          <span class="nav-ico"><i class="fa-solid fa-list"></i></span>

        </a>
      </li>
    </ul>
  </nav>


  <script>
    function applyDefaultPreferencesToForm() {
      const prefs = window.CarSpotPreferences ? window.CarSpotPreferences.getCurrent() : {};
      document.getElementById('color1').value = prefs.gradientStart || '#007aff';
      document.getElementById('color2').value = prefs.gradientEnd || '#5ac8fa';
      document.getElementById('animate-gradient').checked = !!prefs.animateGradient;
      document.getElementById('text-color').value = prefs.textColor || '#1c1c1e';
      document.getElementById('title-color').value = prefs.titleColor || '#1c1c1e';
      document.getElementById('btn-color').value = prefs.buttonColor || '#007aff';
      document.getElementById('btn-text-color').value = prefs.buttonTextColor || '#ffffff';
      document.getElementById('theme-color-picker').value = prefs.themeColor || '#007aff';
    }

    async function applyGradient() {
      const prefs = window.CarSpotPreferences ? window.CarSpotPreferences.getCurrent() : {};
      await window.CarSpotPreferences.save({
        ...prefs,
        gradientStart: document.getElementById('color1').value,
        gradientEnd: document.getElementById('color2').value,
        animateGradient: document.getElementById('animate-gradient').checked,
        backgroundImage: '',
        backgroundColor: document.getElementById('color1').value
      });
    }

    async function applyColors() {
      const prefs = window.CarSpotPreferences ? window.CarSpotPreferences.getCurrent() : {};
      await window.CarSpotPreferences.save({
        ...prefs,
        textColor: document.getElementById('text-color').value,
        titleColor: document.getElementById('title-color').value,
        buttonColor: document.getElementById('btn-color').value,
        buttonTextColor: document.getElementById('btn-text-color').value,
        themeColor: document.getElementById('theme-color-picker').value
      });
    }

    function resetBg() {
      if (window.CarSpotPreferences) {
        window.CarSpotPreferences.reset();
      }
    }

    function uploadBgImage() {
      const fileInput = document.getElementById('bg-file');
      const file = fileInput.files[0];
      if (!file) return alert('Sélectionne une image.');
      const reader = new FileReader();
      reader.onload = function (e) {
        const dataUrl = e.target.result;
        if (window.CarSpotPreferences) {
          window.CarSpotPreferences.save({
            backgroundImage: dataUrl,
            backgroundColor: '',
            gradientStart: '',
            gradientEnd: ''
          });
        }
      };
      reader.readAsDataURL(file);
    }

    function removeBgImage() {
      if (window.CarSpotPreferences) {
        window.CarSpotPreferences.save({ backgroundImage: '', backgroundColor: '#f2f2f7', gradientStart: '', gradientEnd: '' });
      }
    }

    document.addEventListener('DOMContentLoaded', async function () {
      if (window.CarSpotPreferences) {
        await window.CarSpotPreferences.refresh();
      }
      applyDefaultPreferencesToForm();

      const picker = document.getElementById('theme-color-picker');
      const applyBtn = document.getElementById('apply-theme-color');
      const resetBtn = document.getElementById('reset-theme-color');

      if (picker && applyBtn && resetBtn) {
        applyBtn.addEventListener('click', async function () {
          const prefs = window.CarSpotPreferences ? window.CarSpotPreferences.getCurrent() : {};
          await window.CarSpotPreferences.save({ ...prefs, themeColor: picker.value });
        });

        resetBtn.addEventListener('click', async function () {
          await window.CarSpotPreferences.reset();
          applyDefaultPreferencesToForm();
        });
      }
    });
  </script>
</body>

</html>
