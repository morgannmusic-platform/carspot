<!DOCTYPE html>
<html lang="fr">

<head>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.auth) {
        window.auth.onAuthStateChanged(function (user) {
          if (!user) window.location.replace('login.html?redirect=' + encodeURIComponent(window.location.pathname));
        });
      }
    });
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Voitures - CarSpot</title>
  <!-- Favicons & App Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/src/logoapp.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon.ico">
  <link rel="manifest" href="favicon/site.webmanifest">
  <link rel="shortcut icon" href="/favicon.ico">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CarSpot">
  <meta name="theme-color" content="#007aff">
  <meta name="msapplication-TileColor" content="#007aff">
  <meta name="msapplication-TileImage" content="/src/logoapp.png">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="navbar.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="main.js"></script>
  <script src="cars.js"></script>
</head>

<body>
  <main id="app-content">
    <h2>Mes voitures</h2>
    <div style="margin-bottom:10px;">
      <input id="search-car" type="text" placeholder="Rechercher un modèle..."
        style="width:100%;padding:10px;border-radius:50px;border:1px solid #dddddd;">
    </div>
    <div style="margin-bottom:16px;">
      <select id="sort-car" style="width:100%;padding:10px;border-radius:50px;border:1px solid #dddddd;">
        <option value="date-desc">Plus récentes</option>
        <option value="date-asc">Plus anciennes</option>
        <option value="alpha-asc">A → Z</option>
        <option value="alpha-desc">Z → A</option>
      </select>
    </div>
    <div id="cars-grid" class="grid"></div>
  </main>

  <nav class="navbar">
    <ul>
      <li>
        <a href="liste.html">
          <span class="nav-ico"><i class="fa-solid fa-list"></i></span>
          <span class="nav-label">Listes</span>
        </a>
      </li>
      <li>
        <a href="voitures.html">
          <span class="nav-ico"><i class="fa-solid fa-car"></i></span>
          <span class="nav-label">Voitures</span>
        </a>
      </li>
      <li>
        <a href="create-car.html" class="createcar">
          <span class="nav-ico"><i class="fa-solid fa-plus"></i></span>
        </a>
      </li>
      <li>
        <a href="Setting.html">
          <span class="nav-ico"><i class="fa-solid fa-gear"></i></span>
          <span class="nav-label">Réglages</span>
        </a>
      </li>
      <li>
        <a href="account.html">
          <span class="nav-ico"><i class="fa-solid fa-user"></i></span>
          <span class="nav-label">Compte</span>
        </a>
      </li>
    </ul>
  </nav>

  <script src="main.js"></script>
</body>

</html>
