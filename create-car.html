<!DOCTYPE html>
<html lang="fr">

<head>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.auth) {
        window.auth.onAuthStateChanged(function (user) {
          if (!user) window.location.replace('login.html?redirect=' + encodeURIComponent(window.location.pathname));
        });
      }
    });
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CarSpot">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau Spot - CarSpot</title>
  <!-- Favicons & App Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/src/logoapp.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon.ico">
  <link rel="manifest" href="favicon/site.webmanifest">
  <link rel="shortcut icon" href="/favicon.ico">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CarSpot">
  <meta name="theme-color" content="#007aff">
  <meta name="msapplication-TileColor" content="#007aff">
  <meta name="msapplication-TileImage" content="/src/logoapp.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="navbar.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
  <script src="firebase-config.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <main id="app-content">
    <h2>Nouveau Spot</h2>
    <form id="add-car-form" class="glass-form">
      <input type="file" id="c-file" accept="image/*" required>
      <input type="text" id="c-model" placeholder="Modèle" required>
      <textarea id="c-desc" placeholder="Description"></textarea>
      <select id="c-list" required>
        <option value="">Chargement...</option>
      </select>
      <select id="c-rarity" required>
        <option value="1">Très commun</option>
        <option value="2">Commun</option>
        <option value="3">Peu commun</option>
        <option value="4">Rare</option>
        <option value="5">Légendaire</option>
      </select>
      <button type="submit" id="btn-up">Publier</button>
      <div id="car-loader" style="display:none;text-align:center;margin-top:10px;">
        <div class="loader"></div>
        <span style="color:#007aff;">Enregistrement...</span>
      </div>
    </form>
  </main>

  <nav class="navbar">
    <style>
      .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #007aff;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        animation: spin 1s linear infinite;
        display: inline-block;
        vertical-align: middle;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('add-car-form');
        if (!form) return;
        form.addEventListener('submit', function () {
          const loader = document.getElementById('car-loader');
          if (loader) loader.style.display = 'block';
          const btn = document.getElementById('btn-up');
          if (btn) btn.disabled = true;
        });
      });
    </script>
    <ul>
      <li>
        <a href="liste.html">
          <span class="nav-ico"><i class="fa-solid fa-list"></i></span>
          <span class="nav-label">Listes</span>
        </a>
      </li>
      <li>
        <a href="voitures.html">
          <span class="nav-ico"><i class="fa-solid fa-car"></i></span>
          <span class="nav-label">Voitures</span>
        </a>
      </li>
      <li>
        <a href="create-car.html" class="createcar">
          <span class="nav-ico"><i class="fa-solid fa-plus"></i></span>
        </a>
      </li>
      <li>
        <a href="Setting.html">
          <span class="nav-ico"><i class="fa-solid fa-gear"></i></span>
          <span class="nav-label">Réglages</span>
        </a>
      </li>
      <li>
        <a href="account.html">
          <span class="nav-ico"><i class="fa-solid fa-user"></i></span>
          <span class="nav-label">Compte</span>
        </a>
      </li>
    </ul>
  </nav>


  <script>
    window.onload = () => {
      auth.onAuthStateChanged(user => {
        if (!user) return;
        db.collection('lists').where('uid', '==', user.uid).get().then(snap => {
          const sel = document.getElementById('c-list');
          sel.innerHTML = '<option value="">Choisir une liste</option>';
          snap.forEach(doc => sel.innerHTML += `<option value="${doc.id}">${doc.data().name}</option>`);
        });
      });

      document.getElementById('add-car-form').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-up');
        const file = document.getElementById('c-file').files[0];
        btn.disabled = true;

        try {
          const ref = storage.ref(`spots/${auth.currentUser.uid}/${Date.now()}_${file.name}`);
          console.log('Uploading to:', ref.fullPath);
          const uploadResult = await ref.put(file);
          console.log('Upload result:', uploadResult);
          const url = await ref.getDownloadURL();
          console.log('File URL:', url);

          await db.collection('cars').add({
            uid: auth.currentUser.uid,
            model: document.getElementById('c-model').value,
            desc: document.getElementById('c-desc').value,
            listId: document.getElementById('c-list').value,
            rarity: parseInt(document.getElementById('c-rarity').value, 10),
            photoURL: url,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          window.location.href = 'voitures.html';
        } catch (err) {
          alert('Erreur lors de l\'upload ou de la création : ' + err.message);
          console.error(err);
          btn.disabled = false;
        }
      };
    };
  </script>
</body>

</html>
